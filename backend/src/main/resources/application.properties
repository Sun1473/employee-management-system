# ===== Server Configuration =====
server.port=8080

# ===== In-Memory H2 Database Configuration =====
spring.datasource.url=jdbc:h2:mem:employee_management_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate Configuration =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# ===== Logging =====
logging.level.org.springframework.web=INFO
logging.level.com.ems.employeemanagement=DEBUG